[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vreparo"
version = "0.4.0"
description = "Value alignment for safer cross-model KV cache reuse"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["vreparo_artifact*"]
